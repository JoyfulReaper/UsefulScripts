
name: joyful-stack

services:

  nats:
    image: nats:2.14.3-alpine
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 256M

    command:
      - "-js"
      - "-sd"
      - "/data/jetstream"
      - "-m"
      - "8222"

    volumes:
      - nats-data:/data/jetstream

    networks:
      - backend

  happygemini:
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./HappyGemini
      dockerfile: Dockerfile
    image: joyful-stack-happygemini
    restart: unless-stopped
    network_mode: host
    environment:
      # Main configurations
      Gemini__ListenAddress: "::"
      Gemini__DualMode: "true"
      Gemini__Port: "1965"
      Gemini__CertificatePath: "/app/certs/happygemini.pfx"
      GeminiContent__ContentDirectory: "/app/content"
      GeminiContent__IndexFile: "index.gmi"
      GeminiPages__PluginDirectory: "/app/plugins"

      # Host 0
      Gemini__Hostnames__0: "gemini.kgivler.com"

      # Host 1 (Merged from Source 1)
      Gemini__Hostnames__1: "pipes.verymad.net"
      Gemini__Certificates__pipes.verymad.net__Path: "/app/certs/pipes.verymad.net.pfx"
      GeminiContent__Hosts__pipes.verymad.net__ContentDirectory: "/app/content-pipes"
      GeminiContent__Hosts__pipes.verymad.net__UseGlobalPages: "false"

      # Mission Control
      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: "http://127.0.0.1:5190"
      MissionControl__ApiKey: "${HAPPYGEMINI_MISSION_CONTROL_KEY}"
      MissionControl__TimeoutMilliseconds: "1000"
    volumes:
      - /var/lib/happygemini/content:/app/content:ro
      - /var/lib/happygemini/certs:/app/certs:ro
      - /var/lib/happygemini/plugins:/app/plugins:ro
      - /var/lib/happygemini/content-pipes:/app/content-pipes:ro # Merged volume
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      gateway:
        condition: service_healthy

  ntfy:
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    image: binwiederhier/ntfy:v2.26.0
    command:
      - serve
    environment:
      TZ: America/New_York
    volumes:
      - ./config/ntfy:/etc/ntfy:ro
      - ./data/ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:5197:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q '\"healthy\":true' || exit 1"
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true

  happyqotd:
    deploy:
      resources:
        limits:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    build:
      context: ./HappyQOTD
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    network_mode: host

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:5193/health/ready"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5193

      QOTD__ListenAddress: "::"
      QOTD__Port: 17
      QOTD__DualMode: "true"
      QOTD__EnableTcpServer: "true"
      QOTD__EnableUdpServer: "true"
      QOTD__TruncateQuoteResponses: "true"
      QOTD__MaximumQuoteResponseCharacters: "512"
      QOTD__ApiBaseUrl: http://127.0.0.1:5193
      QOTD__MaxConcurrentConnections: 64
      QOTD__RequestTimeoutSeconds: 15

      QOTD__TelemetryIgnoredRemoteAddresses__0: "127.0.0.1"
      QOTD__TelemetryIgnoredRemoteAddresses__1: "172.21.0.10"
      QOTD__TelemetryIgnoredRemoteAddresses__2: "172.21.0.12"

      QotdSecurity__AdminApiKey: ${HAPPYQOTD_ADMIN_API_KEY}

      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://127.0.0.1:5190
      MissionControl__ApiKey: ${HAPPYQOTD_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

      DOTNET_EnableDiagnostics: "0"

    volumes:
      - /var/lib/happyqotd/data:/app/Data

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    depends_on:
      gateway:
        condition: service_healthy

  gitactivity:
    build:
      context: ./MissionControl
      dockerfile: Dockerfile.gitactivity

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    deploy:
      resources:
        limits:
          memory: 256M

    restart: unless-stopped
    init: true

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      Nats__Url: nats://nats:4222
      Nats__ClientName: mission-control-git-activity-production
      Nats__StreamName: MISSION_CONTROL_EVENTS

      NatsConsumer__DurableName: mission-control-git-activity
      NatsConsumer__FilterSubject: events.github.push.received
      NatsConsumer__MaxDeliveries: 5

      GitActivity__DatabaseFileName: git-activity.db
      GitActivity__BasePath: /data
      GitActivity__ApiKey: ${GITACTIVITY_API_KEY}

      GitActivity__AllowedRepositories__0: JoyfulReaper/MissionControl
      GitActivity__AllowedRepositories__1: JoyfulReaper/RandomSteamGame
      GitActivity__AllowedRepositories__2: JoyfulReaper/ReaperShell
      GitActivity__AllowedRepositories__3: JoyfulReaper/HappyQOTD
      GitActivity__AllowedRepositories__4: JoyfulReaper/HappyFinger
      GitActivity__AllowedRepositories__5: JoyfulReaper/HappyEcho
      GitActivity__AllowedRepositories__6: JoyfulReaper/kgivler_com
      GitActivity__AllowedRepositories__7: JoyfulReaper/HappyGopher
      GitActivity__AllowedRepositories__8: JoyfulReaper/JoyfulReaperLib
      GitActivity__AllowedRepositories__9: JoyfulReaper/Rimworld-ReplaceStuff
      GitActivity__AllowedRepositories__10: JoyfulReaper/TheGodsAreReal
      GitActivity__AllowedRepositories__11: JoyfulReaper/PanicZoneToggler
      GitActivity__AllowedRepositories__12: JoyfulReaper/DivineIntervention
      GitActivity__AllowedRepositories__13: JoyfulReaper/BetterTradeColors
      GitActivity__AllowedRepositories__14: JoyfulReaper/ScreenLapse
      GitActivity__AllowedRepositories__15: JoyfulReaper/WhatShouldIWorkOnToday
      GitActivity__AllowedRepositories__16: JoyfulReaper/UsefulScripts
      GitActivity__AllowedRepositories__17: JoyfulReaper/HappyDaytime
      GitActivity__AllowedRepositories__18: JoyfulReaper/Mycelium
      GitActivity__AllowedRepositories__19: JoyfulReaper/Bloat
      GitActivity__AllowedRepositories__20: JoyfulReaper/HappyGemini
      GitActivity__AllowedRepositories__21: JoyfulReaper/SmolSearch

      GitActivity__AllowedBranches__0: main
      GitActivity__AllowedBranches__1: master
      GitActivity__AllowedBranches__2: dev
      GitActivity__AllowedBranches__3: feature-dashboard

    depends_on:
      - nats

    volumes:
      - gitactivity-data:/data

    ports:
      - "127.0.0.1:5192:8080"

    cap_drop:
      - ALL

    tmpfs:
      - /tmp

    read_only: true

    security_opt:
      - no-new-privileges:true

    networks:
      - backend

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  happyecho:
    build:
      context: ./HappyEcho
      dockerfile: Dockerfile

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    deploy:
      resources:
        limits:
          memory: 128M


    restart: unless-stopped
    init: true

    environment:
      DOTNET_ENVIRONMENT: Production

      Echo__ListenAddress: "::"
      Echo__DualMode: "true"
      Echo__Port: 7007
      Echo__UdpEnabled: "false"
      Echo__MaxConcurrentConnections: 64
      Echo__RequestTimeoutSeconds: 15
      Echo__MaxBytesPerConnection: 1048576
      Echo__TelemetryIgnoredRemoteAddress: "172.21.0.1"
      Echo__BlockLoopbackConnections: true

      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://gateway:8080
      MissionControl__ApiKey: ${HAPPYECHO_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

    ports:
      - "7:7007/tcp"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - backend

  happydiscard:
    build:
      context: ./HappyDiscard
      dockerfile: Dockerfile

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 128M

    restart: unless-stopped
    init: true

    environment:
      DOTNET_ENVIRONMENT: Production

      Discard__ListenAddress: "::"
      Discard__Port: 9009
      Discard__DualMode: "true"
      Discard__UdpEnabled: "true"
      Discard__UdpPort: 9009
      Discard__MaxConcurrentConnections: 64
      Discard__RequestTimeoutSeconds: 15
      Discard__MaxBytesPerConnection: 1048576
      Discard__TelemetryIgnoredRemoteAddress: "172.21.0.1"

      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://gateway:8080
      MissionControl__ApiKey: ${HAPPYDISCARD_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

      DOTNET_EnableDiagnostics: "0"

    ports:
      - "0.0.0.0:9:9009/tcp"
      - "[::]:9:9009/tcp"
      - "0.0.0.0:9:9009/udp"
      - "[::]:9:9009/udp"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - backend

  gateway:
    build:
      context: ./MissionControl
      dockerfile: Dockerfile.gateway

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    deploy:
      resources:
        limits:
          memory: 256M


    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      GitHubWebhook__Enabled: "true"
      GitHubWebhook__Secret: "${GITHUB_WEBHOOK_SECRET}"
      GitHubWebhook__AllowedOwner: "JoyfulReaper"
      GitHubWebhook__MaxPayloadBytes: "1048576"

      Nats__Url: nats://nats:4222
      Nats__ClientName: mission-control-gateway-production
      Nats__StreamName: MISSION_CONTROL_EVENTS

      EventSources__Sources__0__Name: happygopher-production
      EventSources__Sources__0__ApiKey: ${HAPPYGOPHER_MISSION_CONTROL_KEY}

      EventSources__Sources__1__Name: happyfinger-production
      EventSources__Sources__1__ApiKey: ${HAPPYFINGER_MISSION_CONTROL_KEY}

      EventSources__Sources__2__Name: kgivler-api-production
      EventSources__Sources__2__ApiKey: ${KGIVLER_API_MISSION_CONTROL_KEY}

      EventSources__Sources__3__Name: randomsteam-production
      EventSources__Sources__3__ApiKey: ${RANDOMSTEAM_MISSION_CONTROL_KEY}

      EventSources__Sources__4__Name: happyecho-production
      EventSources__Sources__4__ApiKey: ${HAPPYECHO_MISSION_CONTROL_KEY}

      EventSources__Sources__5__Name: happyqotd-production
      EventSources__Sources__5__ApiKey: ${HAPPYQOTD_MISSION_CONTROL_KEY}

      EventSources__Sources__6__Name: missioncontrol-agent-production
      EventSources__Sources__6__ApiKey: ${MISSIONCONTROL_AGENT_MISSION_CONTROL_KEY}

      EventSources__Sources__7__Name: happydaytime-production
      EventSources__Sources__7__ApiKey: ${HAPPYDAYTIME_MISSION_CONTROL_KEY}

      EventSources__Sources__8__Name: missioncontrol-dashboard-production
      EventSources__Sources__8__ApiKey: ${MISSIONCONTROL_DASHBOARD_MISSION_CONTROL_KEY}

      EventSources__Sources__9__Name: happydiscard-production
      EventSources__Sources__9__ApiKey: ${HAPPYDISCARD_MISSION_CONTROL_KEY}

      EventSources__Sources__10__Name: "happygopher-mystery"
      EventSources__Sources__10__ApiKey: ${MYSTERYGOPHER_MISSION_CONTROL_KEY}

      EventSources__Sources__11__Name: "happygemini-production"
      EventSources__Sources__11__ApiKey: ${HAPPYGEMINI_MISSION_CONTROL_KEY}

      EventSources__Sources__12__Name: wsiwot-production
      EventSources__Sources__12__ApiKey: ${WSIWOT_MISSION_CONTROL_KEY}

    depends_on:
      - nats

    ports:
      - "127.0.0.1:5190:8080"

    networks:
      - backend

  archive:
    build:
      context: ./MissionControl
      dockerfile: Dockerfile.archive

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    deploy:
      resources:
        limits:
          memory: 256M

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      Nats__Url: nats://nats:4222
      Nats__ClientName: mission-control-archive-production
      Nats__StreamName: MISSION_CONTROL_EVENTS

      NatsConsumer__DurableName: mission-control-archive
      NatsConsumer__FilterSubject: events.>
      NatsConsumer__MaxDeliveries: 5

      EventArchive__DatabaseFileName: mission-control.db
      EventArchive__BasePath: /data

    depends_on:
      - nats

    volumes:
      - archive-data:/data

    ports:
      - "127.0.0.1:5191:8080"

    networks:
      - backend

  wsiwot:
    build:
      context: ./WhatShouldIWorkOnToday
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 256M

    environment:
      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://gateway:8080/
      MissionControl__ApiKey: ${WSIWOT_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      GitHubSync__Enabled: "true"
      GitHubSync__Owner: "JoyfulReaper"
      GitHubSync__Repository: "wsiwot-sync"
      GitHubSync__Branch: "main"
      GitHubSync__Token: ${WSIWOT_GITHUB_SYNC_TOKEN}
      GitHubSync__PollIntervalSeconds: "600"

      Database__Path: /data/WhatShouldIWorkOnToday.db

      Auth__Username: ${WSIWOT_USERNAME}
      Auth__Password: ${WSIWOT_PASSWORD}

      Api__Key: ${WSIWOT_API_KEY}

      TZ: America/New_York
      DOTNET_EnableDiagnostics: "0"

    volumes:
      - /var/lib/wsiwot:/data

    ports:
      - "127.0.0.1:5080:8080"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/health/live"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

  dashboard:
    build:
      context: ./MissionControl
      dockerfile: Dockerfile.dashboard

    restart: unless-stopped
    init: true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      Archive__BaseUrl: http://archive:8080/
      Agent__BaseUrl: https://status-api.kgivler.com/

      GitActivityApi__Enabled: "true"
      GitActivityApi__BaseUrl: http://gitactivity:8080/
      GitActivityApi__ApiKey: ${GITACTIVITY_API_KEY}

      WorkPlanningApi__BaseUrl: http://wsiwot:8080/
      WorkPlanningApi__ApiKey: ${WSIWOT_API_KEY}

      GreenCloud__Enabled: "true"
      GreenCloud__BaseUrl: https://cp.green.cloud/
      GreenCloud__ServerId: b1accaf4-4263-4ec5-ae3b-d29cc880d98d
      GreenCloud__ApiToken: ${GREEN_CLOUD_TOKEN}
      GreenCloud__PollSeconds: 300

      Dashboard__Authentication__DatabaseFileName: dashboard-auth.db
      Dashboard__Authentication__BasePath: /app/data
      Dashboard__Authentication__DataProtectionKeysPath: /app/data/data-protection
      Dashboard__Authentication__CookieLifetimeHours: 8
      Dashboard__Authentication__MaxFailedAttempts: 5
      Dashboard__Authentication__LockoutMinutes: 15

      Dashboard__MobileApi__Enabled: "true"
      Dashboard__MobileApi__TokenHash: ${DASHBOARD_MOBILE_API_TOKEN_HASH}

      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://gateway:8080
      MissionControl__ApiKey: ${MISSIONCONTROL_DASHBOARD_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

      DOTNET_EnableDiagnostics: "0"

    depends_on:
      gateway:
        condition: service_healthy
      archive:
        condition: service_healthy
      gitactivity:
        condition: service_healthy
      wsiwot:
        condition: service_healthy

    volumes:
      - dashboard-data:/app/data

    ports:
      - "127.0.0.1:5195:8080"

    cap_drop:
      - ALL

    tmpfs:
      - /tmp

    read_only: true

    security_opt:
      - no-new-privileges:true

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--header",
          "X-Forwarded-Proto: https",
          "http://localhost:8080/login"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  happydaytime:
    build:
      context: ./HappyDaytime
      dockerfile: Dockerfile

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 128M

    restart: unless-stopped
    init: true

    environment:
      DOTNET_ENVIRONMENT: Production

      Daytime__ListenAddress: 0.0.0.0
      Daytime__Port: 1313
      Daytime__MaxConcurrentConnections: 100
      Daytime__RequestTimeoutSeconds: 15
      Daytime__TelemetryIgnoredRemoteAddress: "172.21.0.1"

      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://gateway:8080
      MissionControl__ApiKey: ${HAPPYDAYTIME_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

      DOTNET_EnableDiagnostics: "0"

    ports:
      - "13:1313/tcp"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - backend

  randomsteam:
    image: joyful/randomsteam:${RANDOMSTEAM_IMAGE_TAG}

    build:
      context: ./RandomSteamGame
      dockerfile: Dockerfile

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    restart: unless-stopped
    init: true

    deploy:
      resources:
        limits:
          memory: 768M


    # This deliberately preserves the application's current
    # loopback-only forwarded-header trust model.
    network_mode: host

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5182

      Steam__ApiKey: ${RANDOMSTEAM_STEAM_API_KEY}
      Steam__ConnectionString: Data Source=steam_cache.db

      DataProtection__ApplicationName: RandomSteamGame
      DataProtection__KeysPath: /data-protection

      Application__CommitSha: ${RANDOMSTEAM_COMMIT_SHA}
      Application__DeploymentType: docker

      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://127.0.0.1:5190
      MissionControl__ApiKey: ${RANDOMSTEAM_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

      DOTNET_EnableDiagnostics: "0"

    volumes:
      - /var/lib/randomsteam/data:/app/Data
      - /var/lib/randomsteam/data-protection:/data-protection

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:5182/health/live"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    depends_on:
      gateway:
        condition: service_healthy

  happyfinger:
    build:
      context: ./HappyFinger
      dockerfile: Dockerfile

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 128M


    environment:
      DOTNET_ENVIRONMENT: Production

      PlanFile__Path: "/data/happyfinger/.plan"
      PlanFile__MaxBytes: "16384"

      FingerContent__OverrideDirectory: "/data/happyfinger/records"
      FingerContent__MaxBytes: "16384"

      RandomSteamGame__BaseUrl: "https://randomsteam.kgivler.com/"
      RandomSteamGame__TimeoutSeconds: "5"

      Finger__ListenAddress: 0.0.0.0
      Finger__Port: 79
      Finger__MaxConcurrentConnections: 64
      Finger__RequestTimeoutSeconds: 15
      Finger__TelemetryIgnoredRemoteAddress: "172.21.0.1"

      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://gateway:8080
      MissionControl__ApiKey: ${HAPPYFINGER_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

    ports:
      - "79:79/tcp"

    volumes:
      - ./data/happyfinger:/data/happyfinger:ro

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - backend

  happygopher:
    build:
      context: ./HappyGopher
      dockerfile: Dockerfile

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 128M


    environment:
      DOTNET_ENVIRONMENT: Production

      Gopher__ListenAddress: "::"
      Gopher__DualMode: "true"
      Gopher__Port: 70
      Gopher__PublicHost: gopher.kgivler.com
      Gopher__ContentRoot: /app/content
      Gopher__MaxConcurrentConnections: 64
      Gopher__MaxSelectorBytes: 4096
      Gopher__RequestTimeoutSeconds: 15
      Gopher__ResponseTimeoutSeconds: "60"
      Gopher__TelemetryIgnoredSelectors__0: "/healthz"

      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: http://gateway:8080
      MissionControl__ApiKey: ${HAPPYGOPHER_MISSION_CONTROL_KEY}
      MissionControl__TimeoutMilliseconds: 1000

      HappyQotd__BaseURL: "https://qotd-api.kgivler.com"
      HappyQotd__TimeoutMilliseconds: 1000
      HappyQotd__Enabled: true

      Guestbook__Enabled: true
      Guestbook__DataPath: /app/data/guestbook.jsonl

    # The host content directory replaces the sample content bundled in the image.
    # Keep the VPS gophermap in sync with the desired production menu.
    volumes:
      - /var/lib/happygopher/content:/app/content:ro
      - /var/lib/happygopher/plugins:/app/plugins:ro
      - /var/lib/happygopher/data:/app/data

    ports:
      - target: 70
        published: "70"
        host_ip: "127.0.0.1"
        protocol: tcp

      - target: 70
        published: "70"
        host_ip: "142.4.38.224"
        protocol: tcp

      - target: 70
        published: "70"
        host_ip: "2607:f2d8:8416:10c1::a"
        protocol: tcp

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - backend

  happygopher-mystery:
    image: joyful-stack-happygopher
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    environment:
      Gopher__ListenAddress: "2607:f2d8:8416:10c1::dead"
      Gopher__DualMode: "false"
      Gopher__Port: "70"
      Gopher__PublicHost: "pipes.verymad.net"
      Gopher__ContentRoot: "/app/content"
      Gopher__MaxConcurrentConnections: "64"
      Gopher__MaxSelectorBytes: "4096"
      Gopher__MaxInputBytes: "1024"
      Gopher__RequestTimeoutSeconds: "15"
      Gopher__ResponseTimeoutSeconds: "60"
      GopherPages__PluginDirectory: "/app/plugins"
      MissionControl__Enabled: "true"
      MissionControl__BaseUrl: "http://127.0.0.1:5190"
      MissionControl__ApiKey: "${MYSTERYGOPHER_MISSION_CONTROL_KEY}"
      MissionControl__TimeoutMilliseconds: "1000"
      HappyQotd__Enabled: "false"
      Guestbook__Enabled: "false"
    volumes:
      - /var/lib/happygopher-mystery/content:/app/content:ro
      - /var/lib/happygopher-mystery/plugins:/app/plugins:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  backend:
    enable_ipv6: true

volumes:
  nats-data:
  archive-data:
  gitactivity-data:
  dashboard-data:
