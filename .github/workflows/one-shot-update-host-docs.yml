name: One-shot host dossier update

on:
  push:
    paths:
      - '.github/workflows/one-shot-update-host-docs.yml'

permissions:
  contents: write

jobs:
  update-host-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update DN42 community metadata notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sections = {
              Path('VPS/Clanker/clanker.txt'): '''===============================================================================
DN42 COMMUNITY METADATA UPDATE — 2026-10-04
===============================================================================

Phase 1 of DN42 standard-community metadata is implemented and verified on
Clanker for IPv4 and IPv6.

BIRD helper:
    /etc/bird/community_filters.conf

Policy:
    informational metadata only
    no community-based local-preference, MED, or route-selection changes

Local origin geography:
    (64511,42)    North America-East
    (64511,1840)  United States

Link metadata tuples use:
    latency, bandwidth, crypto, topology, packet-loss

Current Clanker links:
    RoutedBits EWR:       (1,23,34,83,0)
    Baragoon NY:          (1,23,34,83,0)
    HEADSCARF175 EWR:     (1,0,34,83,0)
    ScopeCreep core:      (5,0,34,83,0)
    hbg1 core:            (3,0,34,83,0)

A value of 0 means unknown and leaves that category untouched. Latency keeps
the worst/highest bucket; bandwidth and crypto keep the weakest value. Origin
geography is added only to locally originated routes. Existing standard and
large communities are preserved.

Packet loss remains unknown on Kyle-controlled links rather than being inferred
from short ping samples.

Verified route inspection showed metadata propagation without changing
BGP.local_pref or otherwise changing route selection.

Canonical documentation:
    VPS/dn42/community-metadata.md

Human-readable route reporter:
    VPS/dn42/dn42-route-report.py

''',
              Path('VPS/ScopeCreep/scopecreep.txt'): '''===============================================================================
DN42 COMMUNITY METADATA UPDATE — 2026-10-04
===============================================================================

Phase 1 of DN42 standard-community metadata is implemented and verified on
ScopeCreep for IPv4 and IPv6.

BIRD helper:
    /etc/bird/community_filters.conf

Policy:
    informational metadata only
    no community-based local-preference, MED, or route-selection changes

ScopeCreep-originated router/service host routes are tagged:
    (64511,44)    North America-West
    (64511,1840)  United States

Current ScopeCreep links:
    iEdon Dallas:        (4,23,34,83,0)
    Kioubit Los Angeles: (3,23,34,83,0)
    MOE233 Las Vegas:    (3,0,34,83,0)
    Clanker core:        (5,0,34,83,0)
    hbg1 core:           (5,0,34,83,0)

Tuple order:
    latency, bandwidth, crypto, topology, packet-loss

A value of 0 means unknown and leaves that category untouched. Existing
communities and large communities are preserved. Packet loss remains unknown
on Kyle-controlled links rather than being inferred from short ping samples.

Verified route inspection showed metadata propagation without changing
BGP.local_pref or otherwise changing route selection.

Canonical documentation:
    VPS/dn42/community-metadata.md

Human-readable route reporter:
    VPS/dn42/dn42-route-report.py

''',
              Path('VPS/HBG1/hbg1.txt'): '''===============================================================================
DN42 COMMUNITY METADATA UPDATE — 2026-10-04
===============================================================================

Phase 1 of DN42 standard-community metadata is implemented and verified on hbg1
for IPv4 and IPv6.

BIRD helper:
    /usr/local/etc/bird/community_filters.conf

IMPORTANT:
    The helper include must appear before direct_lo in /usr/local/etc/bird.conf
    because direct_lo calls dn42_add_origin_geo().

    Backups of peer configs must NOT be stored under:
        /usr/local/etc/bird/peers/

    That directory is wildcard-included by BIRD. Peer-config backups belong in:
        /usr/local/etc/bird/backups/

Policy:
    informational metadata only
    no community-based local-preference, MED, or route-selection changes

hbg1-originated router host routes are tagged:
    (64511,42)    North America-East
    (64511,1840)  United States

Current hbg1 core links:
    Clanker:     (3,0,34,83,0)
    ScopeCreep:  (5,0,34,83,0)

Tuple order:
    latency, bandwidth, crypto, topology, packet-loss

Bandwidth and packet loss remain unknown rather than guessed. IPv4 and IPv6
imports/exports were verified on both internal core sessions. BGP.local_pref
remained 100 during verification.

Canonical documentation:
    VPS/dn42/community-metadata.md

Human-readable route reporter:
    VPS/dn42/dn42-route-report.py

''',
          }

          end_block = (
              '===============================================================================\n'
              'END\n'
              '==============================================================================='
          )
          marker = 'DN42 COMMUNITY METADATA UPDATE — 2026-10-04'

          for path, section in sections.items():
              text = path.read_text()
              if marker in text:
                  print(f'{path}: already updated')
                  continue

              pos = text.rfind(end_block)
              if pos < 0:
                  raise SystemExit(f'{path}: final END block not found')

              before = text[:pos]
              after = text[pos:]
              if before and not before.endswith('\n\n'):
                  before = before.rstrip('\n') + '\n\n'

              path.write_text(before + section + after + ('\n' if text.endswith('\n') else ''))
              print(f'{path}: updated')
          PY

          git diff --check
          git diff --stat

      - name: Commit host dossier updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VPS/Clanker/clanker.txt VPS/ScopeCreep/scopecreep.txt VPS/HBG1/hbg1.txt
          git commit -m 'Document DN42 community metadata on routers'
          git push
